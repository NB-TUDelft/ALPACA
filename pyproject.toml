[project]
name = "alpaca"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "belay>=0.30.1",
    "micropython-rp2-stubs>=1.28.0.post4",
    "simple-term-menu>=1.6.6",
    "typer>=0.26.7",
]

[project.scripts]
alpaca = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "mpremote>=1.28.0",
    "pylint>=4.0.6",
]
