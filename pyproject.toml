[project]
name = "alpaca"
version = "0.2.1"
description = "Libraries for ALPACA 2.0 - NB2420 Electronic Instrumentation"
readme = "README.md"
requires-python = ">=3.14"
license="CC-BY-4.0"
dependencies = [
    "belay>=0.30.1",
    "micropython-rp2-stubs>=1.28.0.post4",
    "mpremote>=1.28.0",
    "mypy>=2.3.0",
    "toml>=0.10.2",
    "typer>=0.26.7",
]

[project.scripts]
alpaca = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]
